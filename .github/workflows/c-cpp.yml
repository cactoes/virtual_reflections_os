# .github/workflows/build.yml
name: Build ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t iso-builder .

    - name: Run build script in container
      run: docker run --rm -v ${{ github.workspace }}:/root/env iso-builder
