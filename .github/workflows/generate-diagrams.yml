name: Generate PlantUML Diagrams

on:
  push:
    paths:
      - 'diagrams/**/*.puml'
      - '.github/workflows/generate-diagrams.yml'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java (for PlantUML)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Install PlantUML
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Generate SVGs from PUML
        run: |
          mkdir -p docs/svg
          for file in docs/*.puml; do
            java -jar plantuml.jar -tsvg "$file" -o svg
          done

      - name: Commit SVG output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto generated diagrams [skip ci]"
          file_pattern: docs/svg/*.svg
